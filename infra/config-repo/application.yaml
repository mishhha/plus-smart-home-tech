spring:
  main:
    banner-mode: off
    log-startup-info: false
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    client:
      config:
        default: # применяется по умолчанию для всех клиентов (можно указать имя @FeignClient вместо default)
          connectTimeout: 3000 # 3 cek - Это время подключения
          readTimeout: 3000 # 3 cek - Это время получения ответа
          loggerLevel: basic

logging:
  level:
    ru:
      yandex:
        practicum:
          inventory: DEBUG
          order: DEBUG
          product: DEBUG
          telemetry: DEBUG
          analyzer: DEBUG
          aggregator: DEBUG
    org:
      springframework: ERROR
      apache:
        kafka: WARN

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.int(1000,9999)}
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/